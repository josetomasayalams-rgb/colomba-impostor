name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build && node scripts/validate-artifact.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx --no-install wrangler d1 migrations apply DB --local
      - name: Verify cloud backend and mobile flows
        run: COLOMBA_CLOUD_MANAGED=1 npm run test:cloud
      - name: Verify GitHub Pages frontend with a separate API
        run: |
          COLOMBA_API_ORIGIN=http://127.0.0.1:4184 npm run build:pages
          npm run test:pages
  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.COLOMBA_API_ORIGIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build the published frontend
        env:
          COLOMBA_API_ORIGIN: ${{ vars.COLOMBA_API_ORIGIN }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages
          include-hidden-files: true
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
